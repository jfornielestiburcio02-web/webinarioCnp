const SVG_NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}
function svg(attrs, ...kids) {
  const n = document.createElementNS(SVG_NS, 'svg');
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  n.append(...kids.flat());
  return n;
}
function rect(x, y, w, h, fill) {
  const r = document.createElementNS(SVG_NS, 'rect');
  for (const [k, v] of Object.entries({ x, y, width: w, height: h, fill })) r.setAttribute(k, v);
  return r;
}

/* ---------------- Contraseñas (PBKDF2 en el navegador) ---------------- */
const enc = new TextEncoder();
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function derive(password, salt) {
  if (!(window.crypto && crypto.subtle)) throw new Error(t('noCrypto'));
  const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 150000 }, key, 256));
}

/* ---------------- Estado y base de datos compartida ---------------- */
const S = { db: null, rows: [], loaded: false, offline: false, noDb: false, canWrite: null, onData: null, view: null, page: 'home', isOwner: false, portals: {}, portalLoaded: false, portalErr: false, coms: [], comLoaded: false, comErr: false, openCom: null };
const rowByPlaca = (p) => S.rows.find((r) => r.placa === p);
const personalRef = (placa) => S.db.doc('personal/' + placa);

async function connect() {
  const timer = setTimeout(() => { if (!S.loaded) { S.offline = true; S.onData && S.onData(); } }, 10000);
  S.db = await window.claude.use('db');
  if (!S.db) { clearTimeout(timer); S.offline = true; S.noDb = true; S.onData && S.onData(); return; }
  try { const user = await window.claude.use('user'); if (user) { S.canWrite = await user.can('data.write'); S.isOwner = await user.isOwner(); } } catch { /* sin dato */ }
  S.db.collection('personal').onSnapshot(
    (snap) => {
      S.rows = snap.docs.map((d) => ({ ...d.data(), placa: d.id }));
      if (!snap.metadata.fromCache) { S.loaded = true; S.offline = false; clearTimeout(timer); }
      S.onData && S.onData();
    },
    () => { S.offline = true; S.onData && S.onData(); }
  );
  S.db.collection('portal').onSnapshot(
    (snap) => {
      S.portals = {};
      snap.docs.forEach((d) => { S.portals[d.id] = d.data(); });
      if (!snap.metadata.fromCache) { S.portalLoaded = true; S.portalErr = false; }
      S.onData && S.onData();
    },
    () => { S.portalLoaded = true; S.portalErr = true; S.onData && S.onData(); }
  );
  S.db.collection('comunicados').onSnapshot(
    (snap) => {
      S.coms = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
      if (!snap.metadata.fromCache) { S.comLoaded = true; S.comErr = false; }
      S.onData && S.onData();
    },
    () => { S.comLoaded = true; S.comErr = true; S.onData && S.onData(); }
  );
}

/* Campo de contraseña con ojo: ojo abierto = se puede ver; ojo tachado = oculta. */
function passField(input) {
  const btn = el('button', { class: 'pw-btn', type: 'button' });
  const paint = () => {
    const shown = input.type === 'text';
    btn.replaceChildren(icon(shown ? 'eye' : 'eyeoff'));
    btn.setAttribute('aria-label', shown ? t('hidePw') : t('showPw'));
    btn.setAttribute('aria-pressed', String(shown));
  };
  btn.addEventListener('click', () => { input.type = input.type === 'password' ? 'text' : 'password'; paint(); input.focus(); });
  paint();
  return el('span', { class: 'pw' }, input, btn);
}

/* ---------------- Pantalla de acceso ---------------- */
function renderAuth(tab = 'login') {
  S.onData = null;
  S.view = () => renderAuth(tab);
  const panel = el('div', { class: 'card' });
  app.replaceChildren(el('div', { class: 'auth' },
    el('aside', { class: 'brand' }, emblem(),
      el('div', { class: 'titles' },
        el('div', { class: 'kicker' }, t('state')),
        el('h1', {}, el('span', { class: 'gold' }, t('titleLead')), t('titleRest'))),
      el('div', { class: 'rule' }),
      el('p', {}, t('brandP'))),
    el('main', { class: 'panel' }, langSwitch(), panel)));

  const say = (box, kind, text) => box.replaceChildren(text ? el('div', { class: 'msg ' + kind, role: kind === 'error' ? 'alert' : 'status' }, text) : '');
  const connLine = () => {
    const ok = S.loaded && !S.offline;
    const text = S.noDb ? t('connNoDb') : ok ? t('connOk') : S.offline ? t('connOffline') : t('connWait');
    return el('div', { class: 'status-line' }, el('span', { class: 'dot' + (ok ? ' on' : '') }), el('span', {}, text));
  };

  function draw() {
    S.onData = null;
    panel.replaceChildren(
      el('div', { class: 'tabs', role: 'tablist' },
        el('button', { type: 'button', role: 'tab', 'aria-selected': String(tab === 'login'), onclick: () => { tab = 'login'; draw(); } }, t('tabLogin')),
        el('button', { type: 'button', role: 'tab', 'aria-selected': String(tab === 'register'), onclick: () => { tab = 'register'; draw(); } }, t('tabRegister'))),
      tab === 'login' ? loginForm() : registerForm());
  }

  function loginForm() {
    const box = el('div');
    const placa = el('input', { id: 'l-placa', class: 'mono', required: true, maxlength: '10', autocomplete: 'username', autocapitalize: 'characters' });
    const pass = el('input', { id: 'l-pass', type: 'password', required: true, maxlength: '128', autocomplete: 'current-password' });
    const btn = el('button', { class: 'btn', type: 'submit' }, t('btnEnter'));
    const status = el('div');
    const refresh = () => { btn.disabled = !S.loaded; status.replaceChildren(connLine()); };
    refresh(); S.onData = refresh;
    return el('form', {
      novalidate: true,
      onsubmit: async (e) => {
        e.preventDefault();
        if (!S.loaded) return;
        btn.disabled = true; say(box, 'error', '');
        const p = placa.value.trim().toUpperCase();
        const row = rowByPlaca(p);
        try {
          const salt = row && row.salt ? unb64(row.salt) : crypto.getRandomValues(new Uint8Array(16));
          const h = await derive(pass.value.slice(0, 128), salt);
          if (!row || h !== row.hash) { say(box, 'error', t('errLogin')); btn.disabled = false; return; }
          if (row.estado === 'pendiente') { say(box, 'warn', t('errPending')); btn.disabled = false; return; }
          if (row.estado === 'rechazado') { say(box, 'error', t('errDenied') + (row.motivo ? t('motive') + row.motivo : '') + t('retry')); btn.disabled = false; return; }
          store.set(p); renderDashboard(p);
        } catch (err) { say(box, 'error', err.message || t('errLoginGeneric')); btn.disabled = false; }
      },
    }, box,
      el('label', { for: 'l-placa' }, t('lblPlaca'), placa),
      el('label', { for: 'l-pass' }, t('lblPass'), passField(pass)),
      btn, status);
  }

  function registerForm() {
    const box = el('div');
    const f = {
      dni: el('input', { id: 'r-dni', class: 'mono', required: true, maxlength: '9', placeholder: '12345678Z', autocomplete: 'off', autocapitalize: 'characters' }),
      nombres: el('input', { id: 'r-nombres', required: true, maxlength: '100', autocomplete: 'off' }),
      placa: el('input', { id: 'r-placa', class: 'mono', required: true, maxlength: '10', autocomplete: 'off', autocapitalize: 'characters' }),
      rango: el('select', { id: 'r-rango', required: true }, el('option', { value: '' }, t('phRango')),
        GROUPS.map((g) => el('optgroup', { label: rankLabel(g.name) }, g.ranks.map((r) => el('option', { value: r }, rankLabel(r)))))),
      pass: el('input', { id: 'r-pass', type: 'password', required: true, minlength: '8', maxlength: '128', autocomplete: 'new-password' }),
      pass2: el('input', { id: 'r-pass2', type: 'password', required: true, minlength: '8', maxlength: '128', autocomplete: 'new-password' }),
    };
    const btn = el('button', { class: 'btn', type: 'submit' }, t('btnRegister'));
    const status = el('div');
    const refresh = () => { btn.disabled = !S.loaded || S.canWrite === false; status.replaceChildren(connLine()); };
    refresh(); S.onData = refresh;
    if (S.canWrite === false) say(box, 'warn', t('readOnly'));

    return el('form', {
      novalidate: true,
      onsubmit: async (e) => {
        e.preventDefault();
        say(box, 'error', '');
        const dni = f.dni.value.trim().toUpperCase();
        const nombres = f.nombres.value.trim().replace(/\s+/g, ' ');
        const placa = f.placa.value.trim().toUpperCase();
        const rango = f.rango.value;
        const pw = f.pass.value;
        if (!/^\d{8}[A-Z]$/.test(dni)) return say(box, 'error', t('vDni'));
        if (!/^[\p{L}][\p{L}\s'.-]{2,99}$/u.test(nombres)) return say(box, 'error', t('vNombres'));
        if (!/^[A-Z0-9]{3,10}$/.test(placa)) return say(box, 'error', t('vPlaca'));
        if (!TIER.has(rango)) return say(box, 'error', t('vRango'));
        if (pw.length < 8 || pw.length > 128) return say(box, 'error', t('vPass'));
        if (pw !== f.pass2.value) return say(box, 'error', t('vPass2'));
        if (!S.loaded) return;

        btn.disabled = true;
        try {
          if (S.rows.some((r) => (r.dni === dni || r.placa === placa) && r.estado !== 'rechazado')) {
            say(box, 'error', t('vDup')); btn.disabled = false; return;
          }
          // Un registro denegado se puede volver a presentar: se sustituye el anterior.
          for (const r of S.rows.filter((x) => x.dni === dni && x.placa !== placa && x.estado === 'rechazado')) await personalRef(r.placa).delete();

          const bootstrap = S.rows.length === 0 && TIER.get(rango) === 4;
          const salt = crypto.getRandomValues(new Uint8Array(16));
          const hash = await derive(pw, salt);
          const now = new Date().toISOString();
          await personalRef(placa).set({
            dni, nombres, placa, rango, salt: b64(salt), hash,
            estado: bootstrap ? 'aprobado' : 'pendiente', creado: now,
            resueltoPor: bootstrap ? 'Arranque del sistema' : null, resueltoEn: bootstrap ? now : null, motivo: null,
          });
          if (bootstrap) { store.set(placa); return renderDashboard(placa); }
          S.onData = null;
          S.view = () => renderAuth('login');
          panel.replaceChildren(el('div', { class: 'done' },
            el('h2', {}, t('sentTitle')),
            el('p', {}, t('sentText')),
            el('button', { class: 'btn', type: 'button', onclick: () => { tab = 'login'; draw(); S.view = () => renderAuth(tab); } }, t('toLogin'))));
        } catch (err) {
          say(box, 'error', err && err.code === 'invalid_argument' ? t('noWrite') : (err.message || t('errRegister')));
          btn.disabled = false;
        }
      },
    }, box,
      el('label', { for: 'r-dni' }, t('lblDni'), f.dni, el('span', { class: 'hint' }, t('hintDni'))),
      el('label', { for: 'r-nombres' }, t('lblNombres'), f.nombres),
      el('label', { for: 'r-placa' }, t('lblPlaca'), f.placa),
      el('label', { for: 'r-rango' }, t('lblRango'), f.rango),
      el('label', { for: 'r-pass' }, t('lblPass'), passField(f.pass), el('span', { class: 'hint' }, t('hintPass'))),
      el('label', { for: 'r-pass2' }, t('lblPass2'), passField(f.pass2)),
      btn, status);
  }

  draw();
}

  return onclick
    ? el('button', { class: 'tile', type: 'button', onclick }, icon(ic), el('span', { class: 't-name' }, name), el('span', { class: 't-desc' }, desc))
    : el('div', { class: 'tile off', 'aria-disabled': 'true' }, icon(ic), el('span', { class: 't-name' }, name), el('span', { class: 'badge' }, t('soonTitle')));
}

function fmtDay(iso) {
  const [y, m, d] = String(iso || '').split('-');
  return y && m && d ? d.padStart(2, '0') + '/' + m.padStart(2, '0') + '/' + y : '—';
}
const yn = (v) => (v ? t('yes') : t('no'));

/* Portal del Funcionario: ficha de un agente. Los datos de cuenta (nombre, rango, DNI) salen de su registro; el resto, de portal/<placa>. */
function portalView(me) {
  const body = el('div', { class: 'portal' });
  const row = (k, v, extra) => el('div', { class: 'field' + (extra ? ' ' + extra : '') }, el('div', { class: 'k' }, k), el('div', { class: 'v' + (extra === 'mono' ? ' mono' : '') }, v));
  const sec = (title, rows) => el('section', { class: 'section' }, el('h2', {}, title), el('div', { class: 'profile' }, rows));

  function refresh() {
    if (!S.portalLoaded) return body.replaceChildren(el('div', { class: 'empty' }, t('portalLoading')));
    if (S.portalErr) return body.replaceChildren(el('div', { class: 'empty' }, t('portalErr')));
    const p = S.portals[me.placa];
    if (!p) return body.replaceChildren(el('div', { class: 'empty' }, t('portalNone')));
    const d = p.disciplinario || {}, j = p.judicial || {}, pe = p.personal || {};
    const foto = /^[\w.-]+\.(png|jpe?g|webp)$/i.test(String(p.foto || '')) ? p.foto : null;
    const main = [
      row(t('rAgente'), me.nombres),
      row(t('rPlaca'), me.placa.split('').join('-'), 'mono'),
      row(t('rRango'), rankLabel(me.rango)),
      row(t('rIngreso'), fmtDay(p.ingreso)),
      row(t('rUnidades'), (Array.isArray(p.unidades) && p.unidades.length ? p.unidades.join(', ') : '—'), 'wide'),
    ];
    body.replaceChildren(
      el('section', { class: 'section hero-card' },
        foto && el('figure', { class: 'portrait' }, el('img', { src: foto, alt: t('portraitAlt') }), el('figcaption', {}, t('portraitCap'))),
        el('div', { class: 'hero-data' }, el('h2', {}, t('secMain')), el('div', { class: 'profile' }, main))),
      sec(t('secDisc'), [
        row(t('rWarn'), (d.leves ?? 0) + ' ' + t('lLeves') + ', ' + (d.graves ?? 0) + ' ' + t('lGraves')),
        row(t('rAsc'), (d.ascensos ?? 0) + ' ' + t('lAsc')),
        row(t('rDesc'), (d.descensos ?? 0) + ' ' + t('lDesc')),
        row(t('rTraspaso'), yn(d.traspaso) + (d.traspaso && d.traspasoDe ? ' · ' + d.traspasoDe : '')),
        row(t('rJunta'), yn(d.juntaSuperior)),
        row(t('rSuperv'), yn(d.supervision)),
        row(t('rExped'), yn(d.expedientes)),
        row(t('rGravedad'), d.gravedad || 'N/A', 'sub'),
      ]),
      sec(t('secJud'), [row(t('rDemandado'), yn(j.demandado)), row(t('rCausas'), yn(j.causasAbiertas))]),
      sec(t('secPers'), [
        row(t('rEstado'), pe.estadoLegal || '—'),
        row(t('rEdad'), pe.edad != null ? String(pe.edad) : '—'),
        row(t('rNacimiento'), pe.nacimiento || '—'),
        row(t('rDniNum'), me.dni, 'mono'),
      ]));
  }
  refresh();
  return { node: body, refresh };
}

const longDay = (iso) => {
  const [y, m, d] = String(iso || '').split('-').map(Number);
  return y && m && d ? new Date(y, m - 1, d).toLocaleDateString(locale(), { day: 'numeric', month: 'long', year: 'numeric' }) : '';
};

/* Comunicados: los ve todo el personal; solo los administradores los publican (colección "comunicados"). */
function comunicadosView() {
  const body = el('div', { class: 'portal' });
  const msg = (text) => body.replaceChildren(el('div', { class: 'empty' }, text));
  const snippet = (c) => {
    const first = (Array.isArray(c.cuerpo) ? c.cuerpo : []).find((b) => b && b.t === 'p' && String(b.x || '').length > 80);
    const x = first ? String(first.x) : '';
    return x.length > 190 ? x.slice(0, 187).trimEnd() + '…' : x;
  };
  function refresh() {
    if (!S.comLoaded) return msg(t('comLoading'));
    if (S.comErr) return msg(t('comErr'));
    const list = S.coms.slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    if (!list.length) return msg(t('comEmpty'));
    const open = S.openCom && list.find((c) => c.id === S.openCom);
    if (open) {
      const blocks = (Array.isArray(open.cuerpo) ? open.cuerpo : []).map((b) => {
        if (b && b.t === 'ul') return el('ul', {}, (Array.isArray(b.items) ? b.items : []).map((i) => el('li', {}, el('strong', {}, String(i.b || '')), i.x ? ': ' + i.x : '')));
        return el('p', {}, String((b && b.x) || ''));
      });
      return body.replaceChildren(el('article', { class: 'section com-article' },
        el('div', { class: 'kicker' }, t('comOfficial')),
        el('h2', {}, open.titulo || ''),
        el('div', { class: 'com-meta' }, el('span', {}, longDay(open.fecha)), open.autor && el('span', {}, t('comBy') + ' ' + open.autor)),
        el('div', { class: 'com-text' }, blocks, open.autor && el('p', { class: 'com-sign' }, open.autor))));
    }
    body.replaceChildren(el('div', { class: 'list' }, list.map((c) => el('button', {
      class: 'com-card', type: 'button', onclick: () => { S.openCom = c.id; S.view(); window.scrollTo(0, 0); },
    },
      el('div', { class: 'com-meta' }, el('span', { class: 'kicker' }, t('comOfficial')), el('span', { class: 'mono' }, fmtDay(c.fecha)), c.autor && el('span', {}, c.autor)),
      el('h3', {}, c.titulo || ''),
      snippet(c) && el('p', { class: 'com-snip' }, snippet(c)),
      el('span', { class: 'badge' }, t('comRead'))))));
  }
  refresh();
  return { node: body, refresh };
}

function renderDashboard(placa) {
  const me = rowByPlaca(placa);
  if (!me || me.estado !== 'aprobado') { store.set(null); return renderAuth('login'); }
  S.view = () => renderDashboard(placa);
  const go = (page) => { S.page = page; S.openCom = null; renderDashboard(placa); window.scrollTo(0, 0); };

  let refreshApprovals = null;
  let content;
  if (S.page === 'portal') {
    const pv = portalView(me);
    refreshApprovals = pv.refresh;
    content = [
      el('button', { class: 'btn ghost small back', type: 'button', onclick: () => go('home') }, t('back')),
      el('div', { class: 'hero' }, el('h2', {}, t('portalTitle')), el('p', { class: 'lead' }, t('portalDesc'))),
      pv.node,
    ];
  } else if (S.page === 'comunicados') {
    const cv = comunicadosView();
    refreshApprovals = cv.refresh;
    const inDetail = !!S.openCom;
    content = [
      el('button', { class: 'btn ghost small back', type: 'button', onclick: inDetail ? () => { S.openCom = null; renderDashboard(placa); window.scrollTo(0, 0); } : () => go('home') }, inDetail ? t('comBack') : t('back')),
      !inDetail && el('div', { class: 'hero' }, el('h2', {}, t('comTitle')), el('p', { class: 'lead' }, t('comDesc'))),
      cv.node,
    ];
  } else {
    content = [
      el('div', { class: 'hero' }, el('h2', {}, t('homeTitle')), el('p', { class: 'lead' }, t('homeLead'))),
      el('div', { class: 'modules' },
        tile('portal', t('portalTitle'), t('portalDesc'), () => go('portal')),
        tile('personal', t('soon1')), tile('unidades', t('soon2')), tile('historial', t('soon3')), tile('comunicados', t('comTitle'), t('comDesc'), () => go('comunicados'))),
    ];
    if (isApprover(me.rango) || me.admin) {
      const a = approvalsSection(me);
      content.push(a.node); refreshApprovals = a.refresh;
    }
  }

  app.replaceChildren(
    el('header', { class: 'topbar' },
      el('div', { class: 'id' }, emblem(), el('div', {},
        el('div', { class: 'kicker' }, t('titleLead') + ' CNP · ' + t('state')),
        el('div', { class: 'name' }, rankLabel(me.rango) + ' · ' + me.nombres))),
      el('div', { class: 'top-actions' }, langSwitch(),
        el('button', { class: 'btn ghost small', type: 'button', onclick: () => { store.set(null); S.page = 'home'; S.openCom = null; renderAuth('login'); } }, t('logout')))),
    el('main', { class: 'wrap' }, content));
  S.onData = refreshApprovals;
}

function approvalsSection(me) {
  const list = el('div', { class: 'list' });
  const status = el('div');
  const flash = (kind, text) => status.replaceChildren(el('div', { class: 'msg ' + kind, role: kind === 'error' ? 'alert' : 'status' }, text));
  const node = el('section', { class: 'section' },
    el('h2', {}, t('pendTitle')),
    el('p', { class: 'lead' }, t('pendLead')),
    status, list);

  async function resolve(r, estado, motivo) {
    try {
      await personalRef(r.placa).update({
        estado, motivo: estado === 'rechazado' ? (motivo || '').trim().slice(0, 200) || null : null,
        resueltoPor: me.rango + ' ' + me.nombres + ' (' + me.placa + ')', resueltoEn: new Date().toISOString(),
      });
      flash('success', estado === 'aprobado' ? t('okApprove') : t('okDeny'));
    } catch (err) {
      flash('error', err && err.code === 'invalid_argument' ? t('noWrite') : (err.message || t('errSave')));
      shown = ''; refresh();
    }
  }

  function card(r) {
    const actions = el('div', { class: 'actions' });
    const buttons = () => actions.replaceChildren(
      el('button', { class: 'btn ok small', type: 'button', onclick: (e) => { e.target.disabled = true; resolve(r, 'aprobado'); } }, t('approve')),
      el('button', { class: 'btn bad small', type: 'button', onclick: deny }, t('deny')));
    const deny = () => {
      const motivo = el('input', { maxlength: '200', placeholder: t('motivePh'), 'aria-label': t('motiveAria') });
      actions.replaceChildren(el('div', { class: 'deny-box' }, motivo, el('div', { class: 'actions' },
        el('button', { class: 'btn bad small', type: 'button', onclick: (e) => { e.target.disabled = true; resolve(r, 'rechazado', motivo.value); } }, t('confirmDeny')),
        el('button', { class: 'btn ghost small', type: 'button', onclick: buttons }, t('cancel')))));
      motivo.focus();
    };
    buttons();
    return el('article', { class: 'req', 'data-placa': r.placa },
      el('div', { class: 'head' }, el('span', { class: 'who' }, r.nombres), el('span', { class: 'badge' }, rankLabel(r.rango))),
      el('div', { class: 'meta' }, el('span', { class: 'mono' }, t('placa') + ' ' + r.placa), el('span', { class: 'mono' }, t('dni') + ' ' + r.dni), el('span', {}, t('requested') + ' ' + fmtDate(r.creado))),
      actions);
  }

  let shown = '';
  function refresh() {
    const pend = S.rows.filter((r) => r.estado === 'pendiente' && (me.admin || canResolve(me.rango, r.rango))).sort((a, b) => String(a.creado).localeCompare(String(b.creado)));
    const key = pend.map((r) => r.placa).join('|');
    if (key === shown) return; // no tocar el DOM si la lista no cambió (conserva lo que se está escribiendo)
    shown = key;
    list.replaceChildren(...(pend.length ? pend.map(card) : [el('div', { class: 'empty' }, t('pendEmpty'))]));
  }
  refresh();
  return { node, refresh };
}

/* ---------------- Arranque ---------------- */
(function init() {
  syncChrome();
  const splash = () => app.replaceChildren(el('div', { class: 'splash' }, emblem(), el('div', {}, t('splash'))));
  S.view = splash;
  splash();
  S.onData = () => {
    if (S.noDb) { S.onData = null; return renderAuth('login'); }
    if (!S.loaded) { if (S.offline) { S.onData = null; renderAuth('login'); } return; }
    const saved = store.get();
    S.onData = null;
    if (saved && rowByPlaca(saved) && rowByPlaca(saved).estado === 'aprobado') renderDashboard(saved);
    else renderAuth('login');
  };
  connect().catch(() => { S.offline = true; S.noDb = true; S.onData && S.onData(); });
})();
</script>

</body></html>
